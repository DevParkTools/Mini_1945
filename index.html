(()=>{

const FONT='"Black Han Sans","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",Impact,sans-serif';
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
if(document.fonts&&document.fonts.load){document.fonts.load('40px "Black Han Sans"').catch(()=>{});}

const SKEY='dawnwings_save1';
const defSV=()=>({hi:0,coins:0,un:[true,false,false,false],sel:0,rank:[],clr:0,maxSt:1,stSel:1,up:[0,0,0,0],set:{bgm:7,sfx:8,sens:5,vib:1,dif:1,fx:0},run:null});
let SV=defSV();
function loadSave(){
 try{
  const raw=localStorage.getItem(SKEY);
  const j=raw?JSON.parse(raw):null;
  if(j&&typeof j==='object'){
   if(typeof j.hi==='number')SV.hi=j.hi;
   if(typeof j.coins==='number')SV.coins=j.coins;
   if(typeof j.clr==='number')SV.clr=j.clr;
   if(typeof j.maxSt==='number')SV.maxSt=clamp(j.maxSt,1,8);
   if(typeof j.stSel==='number')SV.stSel=clamp(j.stSel,1,8);
   if(Array.isArray(j.up))for(let i=0;i<4;i++)if(typeof j.up[i]==='number')SV.up[i]=j.up[i];
   if(Array.isArray(j.un))for(let i=0;i<4;i++)SV.un[i]=!!j.un[i]||i===0;
   if(typeof j.sel==='number'&&j.sel>=0&&j.sel<4)SV.sel=j.sel;
   if(Array.isArray(j.rank))SV.rank=j.rank.filter((r)=>r&&typeof r.s==='number').slice(0,5);
   if(j.set){for(const k of ['bgm','sfx','sens','vib','dif','fx']){if(typeof j.set[k]==='number')SV.set[k]=j.set[k];}}
   if(j.run&&typeof j.run.stage==='number')SV.run=j.run;
  }
 }catch(e){}
 if(!SV.un[SV.sel])SV.sel=0;
SV.stSel=Math.min(SV.stSel,SV.maxSt);
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(SV));}catch(e){}}

 const cs=getComputedStyle(probe);
 safeT=parseFloat(cs.paddingTop)||0;safeB=parseFloat(cs.paddingBottom)||0;safeR=parseFloat(cs.paddingRight)||0;

 else{W=450;sc=Math.min(cw/W,ch/800);H=Math.min(ch/sc,1050);}

  P.x=clamp(P.x,20,W-20);P.y=Math.min(P.y,H-30);

 }

function mk(w,h,s,fn){
 const c=document.createElement('canvas');
 c.width=Math.ceil(w*s);c.height=Math.ceil(h*s);
 const g=c.getContext('2d');
 g.scale(s,s);
 fn(g,w,h);
 return {c:c,w:w,h:h};
}
function star(g,x,y,r){
 g.beginPath();
 for(let i=0;i<10;i++){const a=-PI/2+i*PI/5;const r2=i%2?r*.4:r;g.lineTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2);}
 g.closePath();g.fill();
}
function rr(g,x,y,w,h,r){
 g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
const SS=3;
const T=512;

function mkTile(kind){
 return mk(T,T,2,(g)=>{
  const wrap=(fn)=>{for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)fn(a*T,b*T);};
  const blob=(x,y,r,col)=>{
   wrap((dx,dy)=>{
    const q=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r);
    q.addColorStop(0,col);q.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=q;g.fillRect(x+dx-r,y+dy-r,r*2,r*2);
   });
  };
  const waves=(n,lmin,lmax,cw1,cd)=>{
   for(let i=0;i<n;i++){
    const x=rand(0,T),y=rand(0,T),l=rand(lmin,lmax),a=rand(.08,.3),lw=rand(1,2.2),dark=Math.random()<.25;
    const col=dark?cd.replace('A',String(a)):cw1.replace('A',String(a));
    wrap((dx,dy)=>{g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.arc(x+dx,y+dy,l,PI*1.12,PI*1.88);g.stroke();});
   }
  };
  if(kind===0||kind===1||kind===4){
   g.fillStyle=kind===0?'#1b68c9':(kind===1?'#2a8ed4':'#0f2c62');g.fillRect(0,0,T,T);
   for(let i=0;i<34;i++){
    const light=Math.random()<.5;
    if(kind===4)blob(rand(0,T),rand(0,T),rand(60,140),light?'rgba(60,110,200,.2)':'rgba(2,10,40,.25)');
    else if(kind===1)blob(rand(0,T),rand(0,T),rand(60,140),light?'rgba(150,240,230,.22)':'rgba(10,70,150,.18)');
    else blob(rand(0,T),rand(0,T),rand(60,140),light?'rgba(120,190,255,.18)':'rgba(4,34,110,.2)');
   }
   waves(280,5,12,kind===4?'rgba(170,205,255,A)':'rgba(255,255,255,A)',kind===4?'rgba(5,15,60,A)':'rgba(5,40,120,A)');
  }else if(kind===2){
   g.fillStyle='#5b9b3d';g.fillRect(0,0,T,T);
   for(let i=0;i<24;i++)blob(rand(0,T),rand(0,T),rand(50,120),Math.random()<.5?'rgba(150,210,100,.25)':'rgba(30,90,40,.25)');
   const cols=['#79b04a','#a6b94e','#c9c066','#4f8f38','#8fbf58'];
   for(let i=0;i<30;i++){
    const x=rand(0,T),y=rand(0,T),w=rand(40,110),h=rand(30,80),c=cols[i%5];
    wrap((dx,dy)=>{g.globalAlpha=.78;g.fillStyle=c;g.fillRect(x+dx,y+dy,w,h);g.globalAlpha=.35;g.strokeStyle='#2c5a22';g.lineWidth=1.2;g.strokeRect(x+dx,y+dy,w,h);});
   }
   g.globalAlpha=1;
   for(let i=0;i<220;i++){
    const x=rand(0,T),y=rand(0,T),r=rand(3,7);
    wrap((dx,dy)=>{g.fillStyle='rgba(30,90,36,.85)';g.beginPath();g.arc(x+dx,y+dy,r,0,TAU);g.fill();g.fillStyle='rgba(120,190,90,.6)';g.beginPath();g.arc(x+dx-1,y+dy-1,r*.55,0,TAU);g.fill();});
   }
   for(const off of [-T,0,T]){
    g.lineCap='round';g.lineJoin='round';
    g.strokeStyle='#c9b98a';g.lineWidth=9;g.beginPath();
    for(let y=-20;y<=T+20;y+=8){const x=T*.2+Math.sin(y/T*TAU)*26+off;if(y===-20)g.moveTo(x,y);else g.lineTo(x,y);}
    g.stroke();
    g.strokeStyle='#2f78bf';g.lineWidth=30;g.beginPath();
    for(let y=-20;y<=T+20;y+=8){const x=T*.64+Math.sin(y/T*TAU*2)*42+off;if(y===-20)g.moveTo(x,y);else g.lineTo(x,y);}
    g.stroke();
    g.strokeStyle='#5fa8e6';g.lineWidth=16;g.beginPath();
    for(let y=-20;y<=T+20;y+=8){const x=T*.64+Math.sin(y/T*TAU*2)*42+off;if(y===-20)g.moveTo(x,y);else g.lineTo(x,y);}
    g.stroke();
   }
   for(let i=0;i<16;i++){
    const x=rand(0,T),y=rand(0,T);
    wrap((dx,dy)=>{g.fillStyle='#b85a4a';g.fillRect(x+dx,y+dy,9,7);g.fillStyle='#7a2f2a';g.fillRect(x+dx,y+dy,9,3);});
   }
  }else{
   g.fillStyle='#d8b46c';g.fillRect(0,0,T,T);
   for(let i=0;i<30;i++)blob(rand(0,T),rand(0,T),rand(60,130),Math.random()<.5?'rgba(250,225,150,.3)':'rgba(170,120,50,.25)');
   for(let i=0;i<150;i++){
    const x=rand(0,T),y=rand(0,T),l=rand(18,50),a=rand(.08,.22);
    wrap((dx,dy)=>{g.strokeStyle='rgba(140,95,40,'+a+')';g.lineWidth=1.6;g.beginPath();g.arc(x+dx,y+dy,l,PI*1.1,PI*1.9);g.stroke();});
   }
   for(let i=0;i<36;i++){
    const x=rand(0,T),y=rand(0,T),rx=rand(4,11),ry=rand(3,8);
    wrap((dx,dy)=>{g.fillStyle='rgba(95,70,40,.55)';g.beginPath();g.ellipse(x+dx+2,y+dy+2,rx,ry,0,0,TAU);g.fill();g.fillStyle='#9a7a4c';g.beginPath();g.ellipse(x+dx,y+dy,rx,ry,0,0,TAU);g.fill();});
   }
   for(const off of [-T,0,T]){
    g.strokeStyle='rgba(120,85,45,.5)';g.lineWidth=7;g.lineCap='round';g.beginPath();
    for(let y=-20;y<=T+20;y+=8){const x=T*.4+Math.sin(y/T*TAU)*34+off;if(y===-20)g.moveTo(x,y);else g.lineTo(x,y);}
    g.stroke();
   }
  }
 });
}
const TILES=[null,null,null,null,null];
function getTile(i){if(!TILES[i])TILES[i]=mkTile(i);return TILES[i];}
function mkCloud(w,h){
 return mk(w,h,1.5,(g)=>{
  const blobs=[];
  const n=16+Math.floor(rand(0,10));
  for(let i=0;i<n;i++)blobs.push({x:rand(w*.18,w*.82),y:rand(h*.3,h*.65),r:rand(h*.16,h*.34)});
  for(const b of blobs){
   const q=g.createRadialGradient(b.x,b.y+h*.07,0,b.x,b.y+h*.07,b.r);
   q.addColorStop(0,'rgba(110,150,210,.5)');q.addColorStop(1,'rgba(110,150,210,0)');
   g.fillStyle=q;g.beginPath();g.arc(b.x,b.y+h*.07,b.r,0,TAU);g.fill();
  }
  for(const b of blobs){
   const q=g.createRadialGradient(b.x,b.y-b.r*.2,0,b.x,b.y,b.r);
   q.addColorStop(0,'rgba(255,255,255,.96)');q.addColorStop(.6,'rgba(250,252,255,.72)');q.addColorStop(1,'rgba(255,255,255,0)');
   g.fillStyle=q;g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.fill();
  }
 });
}
function mkIsland(w,h){
 return mk(w,h,1.5,(g)=>{
  const cx=w/2,cy=h/2;
  const blobs=[];
  for(let i=0;i<9;i++){const a=rand(0,TAU),d=rand(0,Math.min(w,h)*.22);blobs.push({x:cx+Math.cos(a)*d*1.3,y:cy+Math.sin(a)*d,r:rand(26,48)});}
  const layer=(col,grow,alpha)=>{g.globalAlpha=alpha;g.fillStyle=col;for(const b of blobs){g.beginPath();g.arc(b.x,b.y,b.r+grow,0,TAU);g.fill();}};
  layer('#7fd6ff',30,.28);layer('#a8e9ff',16,.35);layer('#f2e2a6',6,1);layer('#4f9a3a',-6,1);layer('#3f8430',-16,1);
  g.globalAlpha=1;
  for(let i=0;i<30;i++){
   const b=blobs[i%blobs.length];const a=rand(0,TAU),d=rand(0,b.r*.7);
   const x=b.x+Math.cos(a)*d,y=b.y+Math.sin(a)*d;
   const q=g.createRadialGradient(x-1,y-1,0,x,y,8);q.addColorStop(0,'#5bb345');q.addColorStop(1,'#245a22');
   g.fillStyle=q;g.beginPath();g.arc(x,y,rand(5,8),0,TAU);g.fill();
  }
 });
}
const cloudS=[mkCloud(300,150),mkCloud(360,170),mkCloud(260,130),mkCloud(400,190)];
const islS=[mkIsland(220,180),mkIsland(260,200),mkIsland(190,160)];

const glow=mk(64,64,1,(g)=>{
 const q=g.createRadialGradient(32,32,0,32,32,32);
 q.addColorStop(0,'rgba(255,255,230,1)');q.addColorStop(.25,'rgba(255,214,90,.95)');q.addColorStop(.55,'rgba(255,110,30,.6)');q.addColorStop(1,'rgba(200,30,0,0)');
 g.fillStyle=q;g.fillRect(0,0,64,64);
});
const smokeS=mk(64,64,1,(g)=>{
 const q=g.createRadialGradient(32,32,0,32,32,32);
 q.addColorStop(0,'rgba(70,70,76,.9)');q.addColorStop(.6,'rgba(50,50,56,.5)');q.addColorStop(1,'rgba(30,30,36,0)');
 g.fillStyle=q;g.fillRect(0,0,64,64);
});
const ebS=mk(20,20,2,(g)=>{
 const q=g.createRadialGradient(10,10,0,10,10,10);
 q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(.28,'rgba(255,236,130,1)');q.addColorStop(.55,'rgba(255,70,40,.95)');q.addColorStop(1,'rgba(200,0,0,0)');
 g.fillStyle=q;g.fillRect(0,0,20,20);
});
function mkBullet(rgb,mid,core){
 return mk(14,38,2,(g)=>{
  let q=g.createLinearGradient(0,0,0,38);
  q.addColorStop(0,'rgba('+rgb+',0)');q.addColorStop(.3,'rgba('+rgb+',.4)');q.addColorStop(1,'rgba('+rgb+',.1)');
  g.fillStyle=q;g.beginPath();g.ellipse(7,19,6.4,18,0,0,TAU);g.fill();
  q=g.createLinearGradient(0,2,0,36);q.addColorStop(0,core);q.addColorStop(.5,mid);q.addColorStop(1,'rgba('+rgb+',.2)');
  g.fillStyle=q;g.beginPath();g.ellipse(7,18,3.5,15,0,0,TAU);g.fill();
  g.fillStyle=core;g.beginPath();g.ellipse(7,15,1.6,11,0,0,TAU);g.fill();
 });
}
const PBS=[mkBullet('255,90,50','#ff9a5a','#fff6d8'),mkBullet('60,190,255','#7fe0ff','#effcff'),mkBullet('90,255,110','#a6ff82','#f4fff0'),mkBullet('255,190,40','#ffd34a','#fffbe0')];

function mkItem(label,c0,c1){
 return mk(44,44,2,(g)=>{
  const q=g.createRadialGradient(17,15,2,22,22,20);q.addColorStop(0,c0);q.addColorStop(1,c1);
  g.fillStyle=q;g.beginPath();g.arc(22,22,19,0,TAU);g.fill();

 });

const itM=mk(44,44,2,(g)=>{
 const q=g.createRadialGradient(17,15,2,22,22,20);q.addColorStop(0,'#fff0a0');q.addColorStop(1,'#d79a10');
 g.fillStyle=q;g.beginPath();g.arc(22,22,18,0,TAU);g.fill();

const sprP38=mk(72,72,SS,(g)=>{
 g.lineJoin='round';g.strokeStyle='#243044';g.lineWidth=1.1;
 const hg=(x0,x1,a,b,c)=>{const q=g.createLinearGradient(x0,0,x1,0);q.addColorStop(0,a);q.addColorStop(.5,b);q.addColorStop(1,c);return q;};
 const wg=g.createLinearGradient(0,33,0,47);wg.addColorStop(0,'#f6f8fb');wg.addColorStop(1,'#8693a8');
 g.fillStyle=wg;
 g.beginPath();g.moveTo(1,43);g.lineTo(13,35);g.lineTo(59,35);g.lineTo(71,43);g.lineTo(67,47);g.lineTo(5,47);g.closePath();g.fill();g.stroke();
 g.strokeStyle='rgba(36,48,68,.45)';g.lineWidth=.6;
 for(const x of [18,28,44,54]){g.beginPath();g.moveTo(x,36);g.lineTo(x,46);g.stroke();}
 g.strokeStyle='#243044';g.lineWidth=1.1;
 g.fillStyle='#aab6c8';g.beginPath();g.rect(17,54,38,5);g.fill();g.stroke();
 for(const bx of [22,50]){
  g.fillStyle=hg(bx-5,bx+5,'#8f9bb0','#f3f6fa','#76839a');
  g.beginPath();g.moveTo(bx-4.6,24);g.quadraticCurveTo(bx,11,bx+4.6,24);g.lineTo(bx+3.4,61);g.lineTo(bx-3.4,61);g.closePath();g.fill();g.stroke();
  g.fillStyle='#2a6bd8';g.beginPath();g.ellipse(bx,19,4.9,6.8,0,0,TAU);g.fill();g.stroke();
  g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.ellipse(bx-1.7,17.5,1.3,3.4,0,0,TAU);g.fill();
  g.fillStyle='#8f9bb0';g.beginPath();g.rect(bx-1.4,57,2.8,10);g.fill();g.stroke();
 }
 g.fillStyle=hg(29,43,'#8f9bb0','#f3f6fa','#76839a');
 g.beginPath();g.ellipse(36,36,6.8,17,0,0,TAU);g.fill();g.stroke();
 const cg=g.createLinearGradient(0,25,0,37);cg.addColorStop(0,'#bfe4ff');cg.addColorStop(1,'#0e2f66');
 g.fillStyle=cg;g.beginPath();g.ellipse(36,30,3.9,7,0,0,TAU);g.fill();g.stroke();
 g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.ellipse(35,27.5,1,3,0,0,TAU);g.fill();
 for(const rx of [11,61]){

 }
});
function paintAlly(g,p){
 g.lineJoin='round';g.strokeStyle=p.line;g.lineWidth=1.1;
 const wg=g.createLinearGradient(0,30,0,50);wg.addColorStop(0,p.w0);wg.addColorStop(1,p.w1);
 g.fillStyle=wg;
 g.beginPath();
 if(p.wt===0){g.moveTo(36,32);g.lineTo(4,40);g.lineTo(4,47);g.lineTo(36,46);g.lineTo(68,47);g.lineTo(68,40);g.closePath();}
 else if(p.wt===1){g.ellipse(36,41,34,9,0,0,TAU);}
 else{g.moveTo(36,30);g.lineTo(22,32);g.lineTo(3,42);g.lineTo(7,49);g.lineTo(36,47);g.lineTo(65,49);g.lineTo(69,42);g.lineTo(50,32);g.closePath();}
 g.fill();g.stroke();
 g.fillStyle=p.w0;

   tone(tk.base*Math.pow(2,root/12),spb*7.6,'triangle',.06,0,bgm,nextT);
   tone(tk.base*2*Math.pow(2,(root+tk.th[bar])/12),spb*7.6,'triangle',.04,0,bgm,nextT);

  case 1:for(let i=-1;i<=1;i++)ebul(e.x,e.y+14,a+i*.28,175*s);break;
  case 2:ebul(e.x,e.y,a,200*s);if(diff()>1.4){ebul(e.x,e.y,a+.18,200*s);ebul(e.x,e.y,a-.18,200*s);}break;
  case 3:for(let i=-2;i<=2;i++)ebul(e.x,e.y+30,a+i*.26,165*s);break;
  case 4:ebul(e.x,e.y-29,aimAng(e.x,e.y-29),190*s);ebul(e.x,e.y+36,aimAng(e.x,e.y+36),190*s);break;
  case 7:ebul(e.x,e.y,a,175*s);ebul(e.x,e.y,a+.3,175*s);ebul(e.x,e.y,a-.3,175*s);break;

function bossFire(e,k,a,b,c){

 switch(k){

  case 1:{const o=rand(0,TAU);for(let i=0;i<a;i++)ebul(x,e.y,o+i*TAU/a,b*s,c);break;}
  case 2:e.ba+=c;for(let i=0;i<a;i++)ebul(x,e.y,e.ba+i*TAU/a,b*s);break;
  case 3:{const a0=aimAng(x,y);for(let i=0;i<a;i++)ebul(x,y,a0,(b+i*28)*s);break;}
  case 4:for(let i=0;i<a;i++)ebul(rand(14,W-14),-8,PI/2,(b+rand(-20,20))*s);break;
  case 5:{const n=Math.ceil(W/34),gp=1+Math.floor(Math.random()*(n-3));for(let i=0;i<n;i++){if(i===gp||i===gp+1)continue;ebul(i*34+17,y,PI/2,b*s);}break;}
  case 6:
   if(activeNonBoss()<5){
    const sx=Math.random()<.5?60:W-60;

    else if(a===8)spawn(8,rand(80,W-80),-40,null);

function bossUpdate(e,dt){
 if(e.st===2){
  e.aux+=dt;e.bt-=dt;
  if(e.bt<=0){e.bt=.09;boom(e.x+rand(-e.hw*.9,e.hw*.9),e.y+rand(-e.hh*.9,e.hh*.9),Math.random()<.3?2:1);sBoom(false);shake=Math.max(shake,8);}
  if(e.aux>2.4)finishBoss(e);
  return;
 }
 const bd=e.bd;
 for(let i=0;i<e.parts.length;i++){const p=e.parts[i];if(p.fl>0)p.fl-=dt;}
 if(e.st===0){
  e.y+=100*dt;
  if(e.y>=bd.ty){e.y=bd.ty;e.st=1;e.aux2=0;}
  return;
 }
 e.aux2+=dt;
 const t=e.aux2;
 const ph=e.pa>0?0:(e.hp>e.mhp*.45?1:2);
 if(ph!==e.pp){
  if(e.pp>=0){e.fl=.5;boom(e.x,e.y,2);shake=10;sBoom(true);clearEB();}
  e.pp=ph;
  for(let k=0;k<4;k++)e.tm[k]=.8+k*.3;
  if(ph>0&&bd.esc){spawn(1,70,-30,null);spawn(1,W-70,-30,null);}
 }
 const amp=Math.max(12,W/2-e.hw-12);
 let tx=W/2,ty=bd.ty;
 switch(bd.mv){
  case 0:tx=W/2+Math.sin(t*.55)*amp;ty=bd.ty+Math.sin(t*.9)*10;break;
  case 1:tx=W/2+Math.sin(t*1.0)*amp;ty=bd.ty+Math.sin(t*1.7)*16;break;
  case 2:{
   const c=t%7;
   if(c>5){ty=bd.ty+200*Math.sin((c-5)/2*PI);tx=e.x+(P.x-e.x)*.4;}
   else tx=W/2+Math.sin(t*.7)*amp;
   break;
  }
  case 3:tx=W/2+Math.sin(t*.3)*30;ty=bd.ty+Math.sin(t*.8)*6;break;
  default:tx=W/2+Math.cos(t*.6)*amp;ty=bd.ty+Math.sin(t*1.2)*30;
 }
 e.x+=(tx-e.x)*Math.min(1,dt*2.2);
 e.y+=(ty-e.y)*Math.min(1,dt*(bd.mv===2?6:3));
 e.x=clamp(e.x,e.hw*.6,W-e.hw*.6);
 const at=bd.at[ph],dm=Math.min(2.1,diff());
 for(let k=0;k<at.length;k++){
  e.tm[k]-=dt;
  if(e.tm[k]<=0){const a=at[k];e.tm[k]=a[1]/dm;bossFire(e,a[0],a[2],a[3],a[4]);}
 }
 for(let i=0;i<e.parts.length;i++){
  const p=e.parts[i];
  if(!p.alive)continue;
  p.t-=dt;
  if(p.t<=0){p.t=bd.pr*rand(.9,1.2)/dm;partFire(e,p,bd.pk);}
 }
 if(ph>=1){
  e.sm-=dt;
  if(e.sm<=0){e.sm=.07;pt(1,e.x+rand(-e.hw*.8,e.hw*.8),e.y+rand(-e.hh*.4,e.hh*.5),0,50,.7,rand(20,34));if(ph===2)pt(0,e.x+rand(-e.hw*.8,e.hw*.8),e.y+rand(-e.hh*.4,e.hh*.5),0,40,.4,rand(20,34));}
 }
}

    }else{
     e.sp=Math.min(480,e.sp+520*dt);
     e.x+=Math.cos(e.ang)*e.sp*dt;e.y+=Math.sin(e.ang)*e.sp*dt;
    }

  }
  const mx=e.x-e.px,my=e.y-e.py;
  if(e.kind<=2||e.kind===5){
   if(mx!==0||my!==0){
    const tr=Math.atan2(my,mx)+PI/2;
    let d=tr-e.rot;d=((d+PI)%TAU+TAU)%TAU-PI;

   }
  }
  if(e.y>H+150||e.x<-170||e.x>W+170||e.y<-300){e.a=false;continue;}
  if(e.kind!==5&&P.alive&&e.y>10&&e.y<H-120){

   if(e.bt<=0){e.bt=(e.rate/diff())*rand(.85,1.2);if(e.kind!==3||e.st===1)enemyShoot(e);}
  }
  if(e.kind>=3&&e.kind!==5&&e.hp<e.mhp*.45){
   e.sm-=dt;
   if(e.sm<=0){e.sm=.08;pt(1,e.x+rand(-12,12),e.y+rand(-10,10),0,40,.6,18);if(e.hp<e.mhp*.25)pt(0,e.x+rand(-12,12),e.y+rand(-10,10),0,30,.35,18);}
  }
  if(canHit&&e.kind!==4&&e.kind<7&&Math.abs(P.x-e.x)<e.hw*.85+3&&Math.abs(P.y-e.y)<e.hh*.85+3){

function homing(b,dt){
 let best=null,bd=1e9;
 for(let j=0;j<MAXE;j++){
  const e=EN[j];
  if(!e.a||e.y<-10||(e.boss&&e.st===2))continue;
  const dx=e.x-b.x,dy=e.y-b.y,d=dx*dx+dy*dy;
  if(d<bd){bd=d;best=e;}
 }
 let h=Math.atan2(b.vy,b.vx);
 if(best){
  let t=Math.atan2(best.y-b.y,best.x-b.x)-h;
  t=((t+PI)%TAU+TAU)%TAU-PI;
  h+=clamp(t,-7*dt,7*dt);
 }
 b.sp=Math.min(640,b.sp+700*dt);
 b.vx=Math.cos(h)*b.sp;b.vy=Math.sin(h)*b.sp;
 b.tt-=dt;
 if(b.tt<=0){b.tt=.035;pt(1,b.x,b.y+6,rand(-10,10),30,.4,10);}
}
function updPB(dt){
 for(let i=0;i<MAXPB;i++){
  const b=PB[i];
  if(!b.a)continue;
  if(b.m)homing(b,dt);
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y<-120||b.y>H+40||b.x<-40||b.x>W+40){b.a=false;continue;}
  if(b.c){
   for(let q=0;q<MAXEB;q++){
    const eb=EB[q];
    if(eb.a&&Math.abs(eb.x-b.x)<b.w+6&&Math.abs(eb.y-b.y)<70){eb.a=false;pt(2,eb.x,eb.y,rand(-60,60),rand(-60,60),.2,1);}
   }
   if(Math.random()<.5)pt(0,b.x+rand(-b.w*.5,b.w*.5),b.y+40,0,60,.25,rand(16,30));
  }
  const bw=b.c?b.w:(b.m?3:2+b.k*1.5);
  for(let j=0;j<MAXE;j++){
   const e=EN[j];
   if(!e.a||(e.boss&&e.st===2)||j===b.last)continue;
   if(e.y+e.hh<0)continue;
   if(b.c&&e.cdc>0)continue;
   let r=0;
   if(e.boss)r=bossHit(b,e,bw);
   else if(Math.abs(b.x-e.x)<e.hw+bw&&Math.abs(b.y-e.y)<e.hh+(b.c?30:4))r=1;
   if(r===0)continue;
   if(b.c)e.cdc=.09;
   else if(b.m){b.a=false;boom(b.x,b.y,0);sBoom(false);}
   else{
    if(b.p>0){b.p--;b.last=j;}else b.a=false;
    pt(2,b.x,b.y,rand(-60,60),rand(-120,-40),.2,1);
   }
   if(r===1&&!e.boss){e.hp-=b.d;e.fl=.07;if(e.hp<=0)kill(e);}
   sHit();
   if(!b.a)break;
  }
 }
}
function updEB(dt){

 for(let i=0;i<MAXEB;i++){

function buildStage(){
 EV=[];evI=0;stT=0;
 const st=stage;
 let t=2.4,pc=0;
 const push=(tt,kind,x,y,o)=>{EV.push({t:tt,kind:kind,x:x,y:y,o:o||null});};
 while(t<50){
  pc++;
  let d=null;
  if(pc===5)d='B';
  else if(pc===8&&st>=2)d='L';
  else if(pc%3===1)d='P';
  else if(pc%4===3)d='M';
  const r=Math.random();
  let gap=rand(2.2,3.4);
  if(r<.2){
   const cx=rand(130,320);
   for(let k=-2;k<=2;k++)push(t,0,cx+k*50,-30-Math.abs(k)*34,{bh:0,drop:k===0?d:null});
  }else if(r<.4){
   const x=rand(120,330);
   for(let i=0;i<5;i++)push(t+i*.45,0,x,-30,{bh:1,drop:i===4?d:null});
   gap+=1;
  }else if(r<.55){
   push(t,1,rand(60,140),-30,{drop:d});push(t+.7,1,rand(310,390),-30,null);
  }else if(r<.72){
   const dir=Math.random()<.5?1:-1;
   for(let i=0;i<4;i++)push(t+i*.5,2,dir>0?-30:W+30,rand(70,170),{dir:dir,drop:i===3?d:null});
   gap+=1;
  }else if(r<.84){
   push(t,3,rand(130,320),-60,{drop:d||'M'});gap+=1.5;
  }else if(r<.93){
   if(bio.gr){
    const gx=rand(90,360);
    push(t,Math.random()<.5?7:8,gx,-50,{drop:d||'M'});
    if(st>=2)push(t+.5,7,clamp(gx+rand(-120,120),40,W-40),-50,null);
   }else push(t,4,rand(100,350),-90,{drop:d||'M'});
   gap+=1;
  }else if(st>=3){
   for(let i=0;i<3;i++)push(t+i*.35,5,rand(60,390),-30,{drop:i===0?d:null});
  }else{
   const x=rand(120,330);
   for(let i=0;i<5;i++)push(t+i*.45,0,x,-30,{bh:1,drop:i===4?d:null});
  }
  t+=gap/Math.min(2.1,diff());
 }
 EV.sort((a,b)=>a.t-b.t);
}

const CL=[],ISL=[];
function initBg(){
 CL.length=0;ISL.length=0;

function updBg(dt){
 bgY+=bgSpd*dt;
 for(let i=0;i<CL.length;i++){
  const c=CL[i];c.y+=bgSpd*c.v*dt;
  if(c.y>1300){c.y=-250-rand(0,150);c.x=rand(-650,1100);}
 }
 for(let i=0;i<ISL.length;i++){
  const s=ISL[i];s.y+=bgSpd*dt;
  if(s.y>1300){s.y=-300-rand(0,500);s.x=rand(-200,960);}
 }
}
function update(dt){
 if(slowT>0){slowT-=dt;dt*=.4;}
 updBg(dt);
 syncAudio();
 if(mode==='title'||mode==='select'||mode==='options'||mode==='rank'||mode==='shop'){
  titleT+=dt;
  if(resetArm>0)resetArm-=dt;
  return;
 }
 if(mode==='cont'){
  contT-=dt;updPT(dt);
  const c=Math.ceil(contT);
  if(c!==lastCT){lastCT=c;if(c>0)sTick();}
  if(contT<=0)gameOver();
  return;
 }
 if(mode==='over'){overT+=dt;updPT(dt);if(shake>0)shake=Math.max(0,shake-dt*30);return;}
 if(mode==='ending'){endT+=dt;updPT(dt);return;}
 if(mode!=='play')return;
 if(P.inv>0)P.inv-=dt;
 if(shake>0)shake=Math.max(0,shake-dt*30);
 if(flashA>0)flashA=Math.max(0,flashA-dt*1.4);
 if(banT>0)banT-=dt;
 playerUpdate(dt);
 if(mode!=='play')return;
 stageUpdate(dt);
 updEnemies(dt);
 updPB(dt);
 updEB(dt);
 updItems(dt);
 if(bombT>0)bombUpdate(dt);
 updPT(dt);
 updPops(dt);
}

  ctx.beginPath();ctx.moveTo(UI.bx+6,UI.by-13);ctx.quadraticCurveTo(UI.bx+12,UI.by-23,UI.bx+18,UI.by-19);ctx.stroke();
  ctx.fillStyle='#ff7a2a';ctx.beginPath();ctx.arc(UI.bx+18,UI.by-19,3.2,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(UI.bx-7,UI.by-7,3.5,0,TAU);ctx.fill();
  txt('x'+P.bombs,UI.bx,UI.by+24,16,'#ffffff','center','#0a1a40',3);
  ctx.globalAlpha=.92;
  ctx.fillStyle=chBtn?'rgba(255,120,60,.85)':'rgba(16,36,80,.62)';
  ctx.beginPath();ctx.arc(UI.cx,UI.cy,UI.cr,0,TAU);ctx.fill();
  ctx.strokeStyle='#ffffff';ctx.lineWidth=2.5;ctx.stroke();
  if(P.ch>0){ctx.strokeStyle=P.ch>=1?'#ffe27a':'#7fe0ff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(UI.cx,UI.cy,UI.cr-5,-PI/2,-PI/2+TAU*P.ch);ctx.stroke();}
  txt('CHG',UI.cx,UI.cy+1,15,'#ffffff','center','#0a1a40',3);
  ctx.globalAlpha=.8;
  ctx.fillStyle='rgba(16,36,80,.62)';ctx.beginPath();ctx.arc(UI.px,UI.py,UI.pr,0,TAU);ctx.fill();
  ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#ffffff';
  if(mode==='pause'){ctx.beginPath();ctx.moveTo(UI.px-5,UI.py-7);ctx.lineTo(UI.px+7,UI.py);ctx.lineTo(UI.px-5,UI.py+7);ctx.closePath();ctx.fill();}
  else{ctx.fillRect(UI.px-6,UI.py-7,4,14);ctx.fillRect(UI.px+2,UI.py-7,4,14);}
 }
 ctx.globalAlpha=.8;
 ctx.fillStyle='rgba(16,36,80,.62)';ctx.beginPath();ctx.arc(UI.mx,UI.my,UI.mr,0,TAU);ctx.fill();
 ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#ffffff';
 ctx.beginPath();ctx.moveTo(UI.mx-8,UI.my-3);ctx.lineTo(UI.mx-4,UI.my-3);ctx.lineTo(UI.mx+1,UI.my-7);ctx.lineTo(UI.mx+1,UI.my+7);ctx.lineTo(UI.mx-4,UI.my+3);ctx.lineTo(UI.mx-8,UI.my+3);ctx.closePath();ctx.fill();
 ctx.lineWidth=1.8;
 if(muted){ctx.beginPath();ctx.moveTo(UI.mx+4,UI.my-4);ctx.lineTo(UI.mx+11,UI.my+4);ctx.moveTo(UI.mx+11,UI.my-4);ctx.lineTo(UI.mx+4,UI.my+4);ctx.stroke();}
 else{ctx.beginPath();ctx.arc(UI.mx+1,UI.my,6,-.9,.9);ctx.stroke();ctx.beginPath();ctx.arc(UI.mx+1,UI.my,10,-.9,.9);ctx.stroke();}
 ctx.globalAlpha=1;
}
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality=smQ;
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='#0a3a80';ctx.fillRect(0,0,cw,ch);
 ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);
 drawBg();
 ctx.save();
 ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
 if(mode==='title')drawTitle();
 else if(mode==='select')drawSelect();
 else if(mode==='options')drawOptions();
 else if(mode==='rank')drawRank();
 else if(mode==='shop')drawShop();
 else if(mode==='ending')drawEnding();
 else drawWorld();
 ctx.restore();
 drawFrame();
 drawUI();
}

function inCircle(x,y,cx,cy,r){const dx=x-cx,dy=y-cy;return dx*dx+dy*dy<=r*r;}
let ptrId=null,lpx=0,lpy=0,swX=0;
function isMenu(){return mode==='shop'||mode==='title'||mode==='select'||mode==='options'||mode==='rank'||mode==='pause'||mode==='over';}
cv.addEventListener('pointerdown',(e)=>{
 e.preventDefault();
 initAudio();
 const x=e.clientX,y=e.clientY;
 if(inCircle(x,y,UI.mx,UI.my,UI.mr+6)){toggleMute();return;}
 if((mode==='play'||mode==='pause')&&inCircle(x,y,UI.px,UI.py,UI.pr+8)){if(mode==='pause')sOk();togglePause();return;}
 const lx=(x-ox)/sc,ly=(y-oy)/sc;
 if(mode==='cont'){continueGame();return;}
 if(mode==='ending'){if(endT>3)gameOver(true);return;}
 if(isMenu()){
  const i=hitItem(lx,ly);
  if(i>=0){press(i,lx);return;}
  if(mode==='select'&&ptrId===null){ptrId=e.pointerId;swX=x;}
  return;
 }
 if(mode!=='play')return;
 if(inCircle(x,y,UI.bx,UI.by,UI.br+10)){bomb();return;}
 if(chPtr===null&&inCircle(x,y,UI.cx,UI.cy,UI.cr+10)){chBtn=true;chPtr=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(err){}return;}
 if(ptrId===null){
  ptrId=e.pointerId;lpx=x;lpy=y;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
 }
},{passive:false});
cv.addEventListener('pointermove',(e)=>{
 if(ptrId===null&&isMenu()&&e.pointerType==='mouse'){
  const i=hitItem((e.clientX-ox)/sc,(e.clientY-oy)/sc);
  if(i>=0&&i!==focus)focus=i;
  return;
 }
 if(e.pointerId!==ptrId)return;
 if(mode==='play'&&P.alive&&!P.entering){
  const m=PL[P.pl].sens*SV.set.sens/5*(P.cg?.7:1)*upSpd;
  P.x+=(e.clientX-lpx)/sc*m;
  P.y+=(e.clientY-lpy)/sc*m;
 }
 lpx=e.clientX;lpy=e.clientY;
});
const endPtr=(e)=>{
 if(e.pointerId===chPtr){chBtn=false;chPtr=null;return;}
 if(e.pointerId!==ptrId)return;
 if(mode==='select'){const d=e.clientX-swX;if(Math.abs(d)>40)viewMove(d<0?1:-1);}
 ptrId=null;
};
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',(e)=>{if(e.pointerId===chPtr){chBtn=false;chPtr=null;}if(e.pointerId===ptrId)ptrId=null;});
cv.addEventListener('contextmenu',(e)=>e.preventDefault());
document.addEventListener('gesturestart',(e)=>e.preventDefault());
function navKey(k){
 if(mode==='select'){
  if(k==='ArrowLeft'||k==='KeyA')viewMove(-1);
  else if(k==='ArrowRight'||k==='KeyD')viewMove(1);
  else if(k==='ArrowUp')stageMove(1);
  else if(k==='ArrowDown')stageMove(-1);
  else if(k==='Enter'||k==='Space')press(3);
  else if(k==='Escape')press(0);
  return;
 }
 const a=items();
 const n=a.length;
 if(!n)return;
 if(focus>=n)focus=n-1;
 if(k==='ArrowUp'||k==='KeyW'){focus=(focus+n-1)%n;sMenu();}
 else if(k==='ArrowDown'||k==='KeyS'){focus=(focus+1)%n;sMenu();}
 else if((k==='ArrowLeft'||k==='ArrowRight')&&a[focus]&&a[focus].adj)a[focus].adj(k==='ArrowLeft'?-1:1);
 else if(k==='Enter'||k==='Space'){
  const it=a[focus];
  if(it&&it.adj)it.adj(1);else press(focus);
 }
 else if(k==='Escape'){
  if(mode==='options'||mode==='rank'||mode==='shop'){sBack();go('title');}
  else if(mode==='pause')togglePause();
 }
}
window.addEventListener('keydown',(e)=>{
 const k=e.code;
 if(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'||k==='Space')e.preventDefault();
 initAudio();
 keys[k]=true;
 if(e.repeat)return;
 if(k==='KeyM'){toggleMute();return;}
 if(k==='KeyF'){toggleFs();return;}
 if(mode==='play'){
  if(k==='Space'||k==='KeyB')bomb();
  else if(k==='KeyP'||k==='Escape')togglePause();
  return;
 }
 if(mode==='ending'){if(endT>3&&(k==='Enter'||k==='Space'))gameOver(true);return;}
 if(mode==='cont'){if(k==='Enter'||k==='Space'||k==='KeyZ')continueGame();return;}
 if(mode==='pause'&&k==='KeyP'){togglePause();return;}
 navKey(k);
});
window.addEventListener('keyup',(e)=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{if(mode==='play')togglePause();ptrId=null;chBtn=false;chPtr=null;save();});
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(mode==='play')togglePause();save();}});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>{setTimeout(resize,200);});

applyUp();
if((navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=3)fxLv=1;
applyFx();
resize();
initBg();
getTile(0);
(function warm(i){if(i>=5)return;setTimeout(()=>{try{getTile(i);}catch(e){}warm(i+1);},400);})(1);
let last=0,facc=0,fcnt=0;
function frame(ts){
 requestAnimationFrame(frame);
 if(ts-last<14.5)return;
 const raw=(ts-last)/1000||.016;
 const dt=Math.min(.033,raw);
 last=ts;
 if(mode==='play'&&SV.set.fx===0&&fxLv<3){
  facc+=Math.min(raw,.1);fcnt++;
  if(fcnt>=60){if(facc/fcnt>.022){fxLv++;applyFx();}facc=0;fcnt=0;}
 }
 update(dt);
 render();
}
requestAnimationFrame(frame);
})();
</script>
